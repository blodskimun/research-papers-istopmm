[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "research-library"
version = "0.1.0"
description = "Private, source-linked research evidence retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<4", "jsonschema>=4.23,<5", "mcp>=1.30,<1.31", "uvicorn>=0.35,<0.42"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
build = ["PyMuPDF==1.26.7"]
dev = ["build>=1.2,<2", "pip>=23"]

[project.scripts]
research-mcp-check = "research_library.connection_check:main"
research-library = "research_library.cli:main"
research-build = "research_library.build_cli:main"
research-release = "research_library.release_cli:main"
research-mcp = "research_library.server:main"
research-evaluate = "research_library.evaluation:main"
research-check-cards = "research_library.research_cards:main"
research-http = "research_library.http_server:main"
research-http-token = "research_library.http_auth:main"
research-collections = "research_library.collections:main"
research-literature = "research_library.literature:main"
research-web = "research_library.web_server:main"
research-project = "research_library.build.project_library:main"

[tool.setuptools]
packages = ["research_library", "research_library.build"]
package-dir = {research_library = "src/research_library", "research_library.build" = "tools"}

[tool.setuptools.package-data]
research_library = ["schemas/*.json"]
